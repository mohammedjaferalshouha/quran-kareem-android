name: Android checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test all app and line-reader units
        run: ./gradlew testMadaniDebugUnitTest :feature:linebyline:testReleaseUnitTest

      - name: Lint and database migrations
        run: ./gradlew lintMadaniDebug verifySqlDelightMigration

      - name: Build debug APK
        run: ./gradlew assembleMadaniDebug
